<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Exercises</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .section {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    input, button {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }

    button {
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }

    p {
      background: #020617;
      padding: 8px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h1>JavaScript Exercises</h1>

<!-- LESSON 7 -->
<div class="section">
  <h2>Lesson 7: Variables, Functions & Control Flow</h2>

  <input type="number" id="ageInput" placeholder="Enter age">
  <button onclick="checkAge()">Check Age</button>

  <p id="ageResult"></p>

  <script>
    function checkAge() {
      let age = Number(document.getElementById("ageInput").value);
      let result = "";

      if (age >= 18) {
        result = "You are an Adult";
      } else if (age > 0) {
        result = "You are a Minor";
      } else {
        result = "Enter valid age";
      }

      document.getElementById("ageResult").textContent = result;
    }
  </script>
</div>

<!-- LESSON 8 -->
<div class="section">
  <h2>Lesson 8: Arrays & Objects</h2>

  <input type="text" id="personName" placeholder="Name">
  <input type="number" id="personAge" placeholder="Age">
  <button onclick="addPerson()">Add Person</button>

  <h3>People List</h3>
  <ul id="peopleList"></ul>

  <script>
    const people = [];

    function addPerson() {
      const name = document.getElementById("personName").value;
      const age = Number(document.getElementById("personAge").value);

      if (!name || isNaN(age)) {
        alert("Enter valid data");
        return;
      }

      const person = { name, age };
      people.push(person);

      displayPeople();
    }

    function displayPeople() {
      const list = document.getElementById("peopleList");
      list.innerHTML = "";

      people.forEach(p => {
        const li = document.createElement("li");
        li.textContent = `${p.name} - ${p.age}`;
        list.appendChild(li);
      });
    }
  </script>
</div>

</body>
</html>
