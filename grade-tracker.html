<!DOCTYPE html>
<html>
<head>
  <title>Grade Tracker</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }

    .container {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 95%;
      padding: 8px;
      margin: 5px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 8px;
      margin: 3px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .add { background: #22c55e; color: white; }
    .delete { background: #ef4444; color: white; }
    .recover { background: #3b82f6; color: white; }
    .search { background: #f59e0b; color: white; }

    li {
      background: #334155;
      margin: 5px 0;
      padding: 5px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
    }

    .history {
      margin-top: 15px;
      background: #020617;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Grade Tracker</h2>

  <input type="text" id="name" placeholder="Student Name">
  <input type="number" id="marks" placeholder="Marks">

  <button class="add" onclick="addStudent()">Add</button>
  <button class="search" onclick="searchStudent()">Find</button>

  <h3>Students</h3>
  <ul id="list"></ul>

  <button class="recover" onclick="recoverStudent()">Recover Last Deleted</button>

  <div class="history">
    <h4>Deleted History</h4>
    <ul id="history"></ul>
  </div>
</div>

<script>
const students = [];
const deletedStudents = [];

function getGrade(marks) {
  if (marks >= 80) return "A";
  if (marks >= 70) return "B";
  if (marks >= 60) return "C";
  if (marks >= 50) return "D";
  return "F";
}

function addStudent() {
  const name = document.getElementById("name").value.trim();
  const marks = Number(document.getElementById("marks").value);

  if (!name || isNaN(marks)) {
    alert("Enter valid data");
    return;
  }

  students.push({ name, marks });
  display();
}

function display() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  students.forEach((s, index) => {
    const li = document.createElement("li");
    li.innerHTML = `
      ${s.name} - ${s.marks} (${getGrade(s.marks)})
      <button class="delete" onclick="deleteStudent(${index})">X</button>
    `;
    list.appendChild(li);
  });
}

function deleteStudent(index) {
  const removed = students.splice(index, 1)[0];
  deletedStudents.push(removed);
  display();
  showHistory();
}

function recoverStudent() {
  if (deletedStudents.length === 0) {
    alert("No deleted records");
    return;
  }

  const recovered = deletedStudents.pop();
  students.push(recovered);
  display();
  showHistory();
}

function showHistory() {
  const history = document.getElementById("history");
  history.innerHTML = "";

  deletedStudents.forEach(s => {
    const li = document.createElement("li");
    li.textContent = `${s.name} - ${s.marks}`;
    history.appendChild(li);
  });
}

function searchStudent() {
  const name = document.getElementById("name").value.toLowerCase();

  const found = students.filter(s =>
    s.name.toLowerCase().includes(name)
  );

  if (found.length === 0) {
    alert("Student not found");
    return;
  }

  const list = document.getElementById("list");
  list.innerHTML = "";

  found.forEach(s => {
    const li = document.createElement("li");
    li.textContent = `${s.name} - ${s.marks} (${getGrade(s.marks)})`;
    list.appendChild(li);
  });
}
</script>

</body>
</html>
